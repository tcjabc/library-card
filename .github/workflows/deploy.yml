name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            relay/package-lock.json

      - run: npm ci

      # The sync relay is its own package. Its tests run first (locally, in workerd), so a relay
      # failure blocks the deploy. No Cloudflare account or secret is used.
      - run: npm ci --prefix relay
      - run: npm test --prefix relay
        env:
          WRANGLER_SEND_METRICS: 'false'

      - run: npm run lint

      # A failing test stops the deploy.
      - run: npm test

      - name: Build
        run: npm run build
        env:
          # Project sites live at /<repo>/. Override with a repository variable
          # VITE_BASE=/ for a user site (<name>.github.io) or a custom domain.
          VITE_BASE: ${{ vars.VITE_BASE || format('/{0}/', github.event.repository.name) }}
          VITE_DATA_ADAPTER: ${{ vars.VITE_DATA_ADAPTER || 'local' }}
          VITE_GOOGLE_BOOKS_API_KEY: ${{ vars.VITE_GOOGLE_BOOKS_API_KEY }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
