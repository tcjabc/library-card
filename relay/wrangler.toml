# Library Card sync relay. No secrets live here: rooms are claimed by the first device that pushes
# (it stores only a SHA-256 of that device's token).
# Copied from Peek Budget's relay and changed: see VENDORED.md (source and commit).
name = "library-card-relay"
main = "src/index.js"
compatibility_date = "2026-10-28"
workers_dev = true

# ALLOWED_ORIGINS (the browser origins allowed to call the relay, comma-separated; an entry ending in
# ":*" allows any port) is deliberately not set here. On Cloudflare it is a Worker secret, set once
# with `npx wrangler secret put ALLOWED_ORIGINS`, so no deploy can reset it. For `wrangler dev`, copy
# .dev.vars.example to .dev.vars (localhost only). Without it the relay refuses every request that
# has an Origin header. Requests without one (native code, curl) still need a valid room token.

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "LibraryRoom"

[[migrations]]
tag = "library-card-v1"
new_sqlite_classes = ["LibraryRoom"]

# Encrypted cover photos, stored under "<room id>/<photo id>". The relay only ever sees ciphertext.
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "library-card-blobs"

# Privacy: no per-request invocation logs (they record the URL and request metadata), and nothing
# in the code logs bodies, tokens or envelopes. What remains is the relay's own console output,
# which is limited to error names.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false
